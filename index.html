<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيزو - Bizo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --purple:#a855f7;
  --purple-light:#c084fc;
  --purple-dark:#7e22ce;
  --purple-bg:#faf5ff;
  --white:#ffffff;
  --text:#1f1b2e;
  --muted:#6b7280;
  --border:#ede9fe;
  --danger:#ef4444;
  --success:#22c55e;
  --gradient:linear-gradient(135deg,#a855f7,#7e22ce);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal',sans-serif;background:#f5f3ff;color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center}
.app{width:100%;max-width:430px;height:100vh;max-height:900px;background:var(--white);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(168,85,247,.2)}
@media(min-width:480px){.app{border-radius:32px;height:860px}}
.page{position:absolute;inset:0;display:flex;flex-direction:column;padding:24px;background:var(--white);overflow-y:auto;transition:opacity .3s}
.page.hidden{display:none}
.app-logo-img{width:120px;height:120px;object-fit:contain;margin:0 auto 16px;border-radius:26px;box-shadow:0 8px 24px rgba(168,85,247,.18)}
.logo{font-family:'Changa',sans-serif;font-weight:900;font-size:2rem;color:var(--purple);text-align:center;margin-bottom:8px}
.tag{text-align:center;color:var(--muted);font-size:.95rem;margin-bottom:32px}
h1,h2,h3{font-family:'Changa',sans-serif;color:var(--text);font-weight:900}
h2{font-size:1.6rem;margin-bottom:20px;text-align:right}
.field{margin-bottom:16px}
.field label{display:block;font-weight:700;margin-bottom:6px;font-size:.9rem}
.field input,.field select,.field textarea{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:14px;font:inherit;background:var(--purple-bg);outline:none;transition:all .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple);background:var(--white);box-shadow:0 0 0 4px rgba(168,85,247,.15)}
.btn{width:100%;padding:16px;border:0;border-radius:16px;background:var(--gradient);color:var(--white);font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;transition:transform .15s;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:scale(.97)}
.btn:disabled{background:#d1d5db;cursor:not-allowed}
.btn-google{background:var(--white);color:var(--text);border:1.5px solid var(--border);box-shadow:0 4px 14px rgba(0,0,0,.05)}
.btn-google:hover{border-color:var(--purple)}
.btn-outline{background:transparent;color:var(--purple);border:1.5px solid var(--purple)}
.btn-sm{padding:10px 16px;font-size:.9rem;width:auto;border-radius:12px}
.header-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.back-btn{background:var(--purple-bg);border:0;width:42px;height:42px;border-radius:14px;cursor:pointer;color:var(--purple);font-size:1.3rem;display:flex;align-items:center;justify-content:center}
.link{color:var(--purple);font-weight:700;cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.product-card{background:var(--white);border:1.5px solid var(--border);border-radius:18px;padding:14px;margin-bottom:12px;display:flex;gap:14px;cursor:pointer;transition:all .2s}
.product-card:active{transform:scale(.98);border-color:var(--purple)}
.product-img{width:80px;height:80px;border-radius:14px;background:var(--purple-bg);display:flex;align-items:center;justify-content:center;font-size:2rem;flex-shrink:0;overflow:hidden}
.product-img img{width:100%;height:100%;object-fit:cover}
.product-info{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.product-name{font-weight:800;font-size:1rem;margin-bottom:4px}
.product-price{color:var(--purple);font-weight:900;font-size:1.1rem}
.product-desc{color:var(--muted);font-size:.8rem;margin-top:2px}
.cat-pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;scrollbar-width:none}
.cat-pills::-webkit-scrollbar{display:none}
.pill{padding:10px 18px;border-radius:20px;background:var(--purple-bg);color:var(--purple);border:1.5px solid transparent;font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;white-space:nowrap;flex-shrink:0}
.pill.active{background:var(--gradient);color:var(--white)}
.cart-fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gradient);color:var(--white);padding:14px 28px;border-radius:30px;border:0;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(168,85,247,.4);display:flex;gap:10px;align-items:center}
.cart-count{background:var(--white);color:var(--purple);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:900}
.cart-item{display:flex;gap:12px;align-items:center;padding:12px;border:1.5px solid var(--border);border-radius:14px;margin-bottom:10px}
.qty-ctrl{display:flex;align-items:center;gap:8px;background:var(--purple-bg);border-radius:10px;padding:4px}
.qty-btn{width:28px;height:28px;border:0;border-radius:8px;background:var(--white);color:var(--purple);font-weight:900;cursor:pointer;font-size:1rem}
.qty-num{font-weight:800;min-width:24px;text-align:center}
.total-bar{display:flex;justify-content:space-between;padding:16px;background:var(--purple-bg);border-radius:16px;margin:16px 0;font-weight:800;font-size:1.1rem}
.total-bar span:last-child{color:var(--purple);font-size:1.3rem}
.badge{display:inline-block;padding:4px 10px;border-radius:8px;font-size:.75rem;font-weight:800}
.badge-new{background:#dbeafe;color:#1e40af}
.badge-preparing{background:#fef3c7;color:#92400e}
.badge-delivering{background:#ddd6fe;color:#5b21b6}
.badge-completed{background:#dcfce7;color:#166534}
.badge-cancelled{background:#fee2e2;color:#991b1b}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:4rem;margin-bottom:16px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--white);padding:12px 24px;border-radius:12px;z-index:999;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:slideIn .3s;max-width:90%;text-align:center}
@keyframes slideIn{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
.loading{text-align:center;padding:40px;color:var(--muted)}
.user-avatar{width:42px;height:42px;border-radius:14px;object-fit:cover;border:1.5px solid var(--border)}
.err-box{background:#fee2e2;border:1.5px solid #fecaca;border-radius:12px;padding:12px;margin-top:16px;font-size:.8rem;color:#991b1b;text-align:right;word-break:break-word}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============ Firebase ============ */
const firebaseConfig = {
  apiKey: "AIzaSyAeZnFLFPWNCu42X1Qcgf2Pou9nWvn0Gy0",
  authDomain: "bizo-ly.firebaseapp.com",
  databaseURL: "https://bizo-ly-default-rtdb.firebaseio.com",
  projectId: "bizo-ly",
  storageBucket: "bizo-ly.firebasestorage.app",
  messagingSenderId: "831375070257",
  appId: "1:831375070257:web:93a804d00ba0728131b110"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();
const googleProvider = new firebase.auth.GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt: 'select_account' });

const APP_LOGO = "https://up6.cc/2026/11/179555196156461.png";

/* ============ State ============ */
const S = {
  user: null,
  tempGoogleUser: null,
  page: 'splash',
  categories: {},
  products: {},
  cart: {},
  areas: {},
  activeCategory: 'all',
  settings: {},
  authLoading: false,
  currentProduct: null,
  lastError: ''
};

const app = document.getElementById('app');

/* ============ Helpers ============ */
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
function money(n){return (Number(n)||0).toLocaleString('ar-LY')+' د.ل'}
function goTo(p){S.page=p;render()}
function saveSession(){if(S.user)localStorage.setItem('bizo_user',JSON.stringify(S.user))}
function clearSession(){localStorage.removeItem('bizo_user')}
function loadSession(){try{const u=localStorage.getItem('bizo_user');if(u)return JSON.parse(u)}catch(e){}return null}
function saveCurrentProduct(){try{if(S.currentProduct)sessionStorage.setItem('bizo_current_product',S.currentProduct);else sessionStorage.removeItem('bizo_current_product')}catch(e){}}
function loadCurrentProduct(){try{return sessionStorage.getItem('bizo_current_product')}catch(e){return null}}

/* ============ Init ============ */
function init(){
  S.user = loadSession();
  S.currentProduct = loadCurrentProduct();

  S.page = (S.user && S.user.phone && S.user.areaId) ? 'shop' : 'splash';
  render();

  db.ref('categories').on('value',s=>{S.categories=s.val()||{};if(S.page==='shop')render()});
  db.ref('products').on('value',s=>{S.products=s.val()||{};if(S.page==='shop'||S.page==='product')render()});
  db.ref('deliveryAreas').on('value',s=>{S.areas=s.val()||{};if(S.page==='completeProfile'||S.page==='checkout')render()});
  db.ref('appSettings').on('value',s=>{S.settings=s.val()||{}});

  auth.onAuthStateChanged(fbUser => {
    if (!fbUser && S.user && !S.tempGoogleUser && !S.authLoading) {
      clearSession();
      S.user = null;
      if (S.page !== 'splash' && S.page !== 'completeProfile') goTo('splash');
    }
  });
}

/* ============ Google Login — Popup أولاً، Redirect كبديل ============ */
async function loginWithGoogle(){
  if(S.authLoading) return;
  S.authLoading = true;
  S.lastError = '';
  render();

  try {
    // المحاولة 1: Popup (يعمل في معظم البيئات)
    const result = await auth.signInWithPopup(googleProvider);
    S.authLoading = false;
    await finishGoogleLogin(result.user);
    return;
  } catch (e) {
    console.warn('Popup failed:', e.code, e.message);

    // إذا أغلق المستخدم النافذة يدوياً — لا داعي للبديل
    if (e.code === 'auth/popup-closed-by-user') {
      S.authLoading = false;
      render();
      return;
    }

    // إذا كان الخطأ "popup-blocked" أو غيره — جرّب Redirect
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment' || e.code === 'auth/cancelled-popup-request') {
      try {
        await auth.signInWithRedirect(googleProvider);
        return;
      } catch (e2) {
        S.authLoading = false;
        S.lastError = (e2.code || '') + ' — ' + (e2.message || '');
        render();
        toast('تعذر تسجيل الدخول');
        return;
      }
    }

    // خطأ آخر — اعرض التفاصيل للمستخدم
    S.authLoading = false;
    S.lastError = (e.code || '') + ' — ' + (e.message || '');
    render();
    toast('تعذر تسجيل الدخول: ' + (e.code || e.message || ''));
  }
}

/* ============ إكمال تسجيل الدخول ============ */
async function finishGoogleLogin(gUser){
  try {
    const snap = await db.ref('users/' + gUser.uid).get();
    const existingData = snap.val();

    if (existingData && existingData.phone && existingData.areaId) {
      S.user = {
        uid: gUser.uid,
        email: gUser.email || existingData.email || '',
        name: existingData.name || gUser.displayName || 'مستخدم بيزو',
        photo: gUser.photoURL || existingData.photo || '',
        phone: existingData.phone,
        areaId: existingData.areaId,
        areaName: existingData.areaName || ''
      };
      saveSession();
      S.authLoading = false;
      toast('مرحباً بعودتك ' + S.user.name);
      goTo('shop');
    } else {
      S.tempGoogleUser = {
        uid: gUser.uid,
        email: gUser.email || '',
        name: gUser.displayName || '',
        photo: gUser.photoURL || ''
      };
      S.authLoading = false;
      goTo('completeProfile');
    }
  } catch (e) {
    S.authLoading = false;
    S.lastError = (e.code || '') + ' — ' + (e.message || '');
    render();
    toast('خطأ في قراءة البيانات');
  }
}

/* ============ Splash ============ */
function renderSplash(){
  return `<div class="page" style="justify-content:center;text-align:center">
    <img src="${APP_LOGO}" alt="بيزو" class="app-logo-img" onerror="this.style.display='none'">
    <div class="logo">بيزو</div>
    <p class="tag">متجرك الإلكتروني الشامل</p>
    <div style="margin-top:48px">
      <button class="btn btn-google" id="googleBtn" onclick="loginWithGoogle()" ${S.authLoading?'disabled':''}>
        <svg width="22" height="22" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span>${S.authLoading?'جاري الاتصال بجوجل...':'المتابعة باستخدام Google'}</span>
      </button>
    </div>
    ${S.lastError ? `<div class="err-box"><b>سبب الخطأ:</b><br>${esc(S.lastError)}</div>` : ''}
  </div>`;
}

/* ============ Complete Profile ============ */
function renderCompleteProfile(){
  if(!S.tempGoogleUser){S.page='splash';return renderSplash()}
  const areas = Object.entries(S.areas).filter(([id,a])=>a.enabled!==false);
  return `<div class="page">
    <div class="header-bar">
      <button class="back-btn" onclick="cancelProfileSetup()">→</button>
      <span style="font-weight:800">إكمال البيانات</span>
      <div style="width:42px"></div>
    </div>
    <div style="text-align:center;margin-bottom:20px">
      ${S.tempGoogleUser.photo?`<img src="${esc(S.tempGoogleUser.photo)}" style="width:68px;height:68px;border-radius:50%;margin-bottom:10px;border:2px solid var(--purple)">`:''}
      <div style="font-weight:800;font-size:1.1rem">أهلاً ${esc(S.tempGoogleUser.name||'بك')} 👋</div>
      <p style="color:var(--muted);font-size:.85rem;margin-top:4px">أدخل رقم هاتفك واختر منطقتك للمتابعة</p>
    </div>
    <div class="field">
      <label>الاسم</label>
      <input type="text" id="profName" value="${esc(S.tempGoogleUser.name||'')}" placeholder="الاسم الكامل">
    </div>
    <div class="field">
      <label>رقم الهاتف</label>
      <input type="tel" id="profPhone" placeholder="0912345678" maxlength="10" inputmode="numeric" dir="ltr" style="text-align:right">
    </div>
    <div class="field">
      <label>المنطقة</label>
      <select id="profArea">
        <option value="">-- اختر منطقتك --</option>
        ${areas.map(([id,a])=>`<option value="${id}">${esc(a.name)} (${money(a.fee||0)})</option>`).join('')}
      </select>
    </div>
    <button class="btn" id="saveProfBtn" onclick="saveProfileData()">حفظ ودخول المتجر</button>
  </div>`;
}

function cancelProfileSetup(){
  auth.signOut().catch(()=>{});
  S.tempGoogleUser=null;
  goTo('splash');
}

async function saveProfileData(){
  const name = document.getElementById('profName').value.trim();
  const rawPhone = document.getElementById('profPhone').value.replace(/\D/g,'');
  const areaId = document.getElementById('profArea').value;

  if(!name) return toast('يرجى إدخال الاسم');
  if(rawPhone.length < 9) return toast('يرجى إدخال رقم هاتف صحيح');
  if(!areaId) return toast('يرجى اختيار المنطقة');

  let phone = rawPhone;
  if(phone.startsWith('0')) phone = '+218' + phone.slice(1);
  else if(!phone.startsWith('218')) phone = '+218' + phone;
  else phone = '+' + phone;

  const area = S.areas[areaId];
  const userData = {
    uid: S.tempGoogleUser.uid,
    email: S.tempGoogleUser.email,
    name: name,
    photo: S.tempGoogleUser.photo,
    phone: phone,
    areaId: areaId,
    areaName: area ? area.name : '',
    verified: true,
    createdAt: Date.now()
  };

  try{
    const btn = document.getElementById('saveProfBtn');
    if(btn){btn.disabled=true;btn.textContent='جاري الحفظ...';}
    await db.ref('users/' + userData.uid).set(userData);
    S.user = userData;
    S.tempGoogleUser = null;
    saveSession();
    toast('تم تسجيل الدخول بنجاح 🎉');
    goTo('shop');
  }catch(e){
    toast('خطأ في حفظ البيانات: ' + e.message);
    render();
  }
}

/* ============ Shop ============ */
function renderShop(){
  const cats = Object.entries(S.categories).filter(([id,c])=>c.enabled!==false);
  const prods = Object.entries(S.products).filter(([id,p])=>p.available!==false && (S.activeCategory==='all'||p.categoryId===S.activeCategory));
  const cartCount = Object.values(S.cart).reduce((a,b)=>a+b,0);
  return `<div class="page" style="padding-bottom:100px">
    <div class="row">
      <div>
        <div style="font-size:.85rem;color:var(--muted)">أهلاً بك 👋</div>
        <div style="font-weight:800;font-size:1.2rem">${esc(S.user.name||S.user.phone)}</div>
      </div>
      ${S.user.photo
        ? `<img src="${esc(S.user.photo)}" class="user-avatar" style="cursor:pointer" onclick="goTo('account')" alt="حسابي">`
        : `<button class="back-btn" onclick="goTo('account')">👤</button>`}
    </div>
    <div class="cat-pills">
      <button class="pill ${S.activeCategory==='all'?'active':''}" onclick="setCategory('all')">الكل</button>
      ${cats.map(([id,c])=>`<button class="pill ${S.activeCategory===id?'active':''}" onclick="setCategory('${id}')">${esc(c.name)}</button>`).join('')}
    </div>
    ${prods.length?prods.map(([id,p])=>`
      <div class="product-card" onclick="openProduct('${id}')">
        <div class="product-img">${p.image?`<img src="${esc(p.image)}" alt="">`:'🛒'}</div>
        <div class="product-info">
          <div>
            <div class="product-name">${esc(p.name)}</div>
            <div class="product-desc">${esc((p.description||'').slice(0,50))}</div>
          </div>
          <div class="product-price">${money(p.price)}</div>
        </div>
      </div>
    `).join(''):'<div class="empty"><div class="empty-icon">📦</div><p>لا توجد منتجات متاحة</p></div>'}
    ${cartCount?`<button class="cart-fab" onclick="goTo('cart')">🛒 السلة <span class="cart-count">${cartCount}</span></button>`:''}
  </div>`;
}

function setCategory(id){S.activeCategory=id;render()}

/* ============ Product ============ */
function renderProduct(){
  const id = S.currentProduct;
  const p = S.products[id];
  if(!p){S.page='shop';return renderShop()}
  const qty=S.cart[id]||0;
  return `<div class="page">
    <div class="header-bar">
      <button class="back-btn" onclick="goTo('shop')">→</button>
      <span style="font-weight:800">تفاصيل المنتج</span>
      <div style="width:42px"></div>
    </div>
    <div style="height:200px;background:var(--purple-bg);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:5rem;margin-bottom:20px;overflow:hidden">
      ${p.image?`<img src="${esc(p.image)}" style="width:100%;height:100%;object-fit:cover">`:'🛒'}
    </div>
    <h2 style="margin-bottom:8px">${esc(p.name)}</h2>
    <div style="color:var(--purple);font-weight:900;font-size:1.6rem;margin-bottom:16px">${money(p.price)}</div>
    <p style="color:var(--muted);line-height:1.8;margin-bottom:24px">${esc(p.description||'لا يوجد وصف')}</p>
    ${qty?`
      <div class="row" style="margin-bottom:16px">
        <span style="font-weight:700">الكمية في السلة:</span>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty('${id}',-1)">−</button>
          <span class="qty-num">${qty}</span>
          <button class="qty-btn" onclick="changeQty('${id}',1)">+</button>
        </div>
      </div>
      <button class="btn btn-outline" onclick="goTo('cart')">عرض السلة</button>
    `:`
      <button class="btn" onclick="addToCart('${id}')">أضف إلى السلة</button>
    `}
  </div>`;
}

function openProduct(id){
  S.currentProduct = id;
  saveCurrentProduct();
  goTo('product');
}

/* ============ Cart ============ */
function renderCart(){
  const items=Object.entries(S.cart).map(([id,qty])=>({id,qty,p:S.products[id]})).filter(x=>x.p);
  const subtotal=items.reduce((s,x)=>s+x.p.price*x.qty,0);
  return `<div class="page">
    <div class="header-bar">
      <button class="back-btn" onclick="goTo('shop')">→</button>
      <span style="font-weight:800">السلة</span>
      <div style="width:42px"></div>
    </div>
    <h2>سلة التسوق</h2>
    ${items.length?items.map(x=>`
      <div class="cart-item">
        <div class="product-img" style="width:56px;height:56px;font-size:1.5rem">${x.p.image?`<img src="${esc(x.p.image)}">`:'🛒'}</div>
        <div style="flex:1">
          <div style="font-weight:800">${esc(x.p.name)}</div>
          <div style="color:var(--purple);font-weight:900">${money(x.p.price*x.qty)}</div>
        </div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty('${x.id}',-1)">−</button>
          <span class="qty-num">${x.qty}</span>
          <button class="qty-btn" onclick="changeQty('${x.id}',1)">+</button>
        </div>
      </div>
    `).join(''):'<div class="empty"><div class="empty-icon">🛒</div><p>السلة فارغة</p></div>'}
    ${items.length?`
      <div class="total-bar"><span>المجموع</span><span>${money(subtotal)}</span></div>
      <button class="btn" onclick="goTo('checkout')">متابعة الطلب</button>
    `:''}
  </div>`;
}

function addToCart(id){S.cart[id]=(S.cart[id]||0)+1;render();toast('أُضيف للسلة')}
function changeQty(id,d){
  const n=(S.cart[id]||0)+d;
  if(n<=0)delete S.cart[id];else S.cart[id]=n;
  render();
}

/* ============ Checkout ============ */
function renderCheckout(){
  const items=Object.entries(S.cart).map(([id,qty])=>({id,qty,p:S.products[id]})).filter(x=>x.p);
  if(!items.length){S.page='cart';return renderCart()}
  const subtotal=items.reduce((s,x)=>s+x.p.price*x.qty,0);
  const areas=Object.entries(S.areas).filter(([id,a])=>a.enabled!==false);
  const defaultArea = S.areas[S.user.areaId];
  const initialFee = defaultArea ? Number(defaultArea.fee||0) : 0;

  return `<div class="page">
    <div class="header-bar">
      <button class="back-btn" onclick="goTo('cart')">→</button>
      <span style="font-weight:800">إتمام الطلب</span>
      <div style="width:42px"></div>
    </div>
    <h2>بيانات التوصيل</h2>
    <div class="field">
      <label>الاسم</label>
      <input id="coName" value="${esc(S.user.name||'')}" placeholder="الاسم الكامل">
    </div>
    <div class="field">
      <label>الهاتف</label>
      <input id="coPhone" value="${esc(S.user.phone)}" dir="ltr" style="text-align:right">
    </div>
    <div class="field">
      <label>منطقة التوصيل</label>
      <select id="coArea" onchange="updateDelivery()">
        <option value="">اختر المنطقة</option>
        ${areas.map(([id,a])=>`<option value="${id}" data-fee="${a.fee||0}" ${S.user.areaId===id?'selected':''}>${esc(a.name)} (${money(a.fee||0)})</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>العنوان بالتفصيل</label>
      <textarea id="coAddress" rows="2" placeholder="الشارع، أقرب معلم..."></textarea>
    </div>
    <div class="field">
      <label>طريقة الدفع</label>
      <select id="coPay">
        <option value="نقداً عند الاستلام">نقداً عند الاستلام</option>
        <option value="تحويل مصرفي">تحويل مصرفي</option>
        <option value="OnePay">OnePay</option>
      </select>
    </div>
    <div class="field">
      <label>ملاحظات (اختياري)</label>
      <textarea id="coNotes" rows="2" placeholder="أي تفاصيل إضافية..."></textarea>
    </div>
    <div class="total-bar">
      <span>المجموع الفرعي</span>
      <span>${money(subtotal)}</span>
    </div>
    <div class="total-bar" style="background:#fff;border:1.5px solid var(--border)">
      <span>رسوم التوصيل</span>
      <span id="delFee">${money(initialFee)}</span>
    </div>
    <div class="total-bar" style="background:var(--gradient);color:#fff">
      <span>الإجمالي</span>
      <span id="grandTotal" style="color:#fff">${money(subtotal+initialFee)}</span>
    </div>
    <button class="btn" onclick="placeOrder()">تأكيد الطلب</button>
  </div>`;
}

function updateDelivery(){
  const sel=document.getElementById('coArea');
  const opt=sel.selectedOptions[0];
  const fee=Number(opt?.dataset?.fee||0);
  const subtotal=Object.entries(S.cart).reduce((s,[id,q])=>s+(S.products[id]?.price||0)*q,0);
  document.getElementById('delFee').textContent=money(fee);
  document.getElementById('grandTotal').textContent=money(subtotal+fee);
}

async function placeOrder(){
  const name=document.getElementById('coName').value.trim();
  const phone=document.getElementById('coPhone').value.trim();
  const areaId=document.getElementById('coArea').value;
  const address=document.getElementById('coAddress').value.trim();
  const pay=document.getElementById('coPay').value;
  const notes=document.getElementById('coNotes').value.trim();
  if(!name)return toast('أدخل الاسم');
  if(!phone)return toast('أدخل رقم الهاتف');
  if(!areaId)return toast('اختر منطقة التوصيل');
  if(!address)return toast('أدخل العنوان');

  const area=S.areas[areaId];
  const items=Object.entries(S.cart).map(([id,qty])=>({
    productId:id,name:S.products[id].name,price:S.products[id].price,qty,
    subtotal:S.products[id].price*qty
  }));
  const subtotal=items.reduce((s,x)=>s+x.subtotal,0);
  const fee=Number(area.fee||0);
  const order={
    id:null, userUid:S.user.uid, userPhone:phone, userName:name,
    areaId, areaName:area.name, fee, address, notes, payMethod:pay,
    items, subtotal, total:subtotal+fee,
    status:'new', createdAt:Date.now()
  };
  try{
    const ref=db.ref('orders').push();
    order.id=ref.key;
    await ref.set(order);
    S.cart={};
    toast('تم إرسال طلبك بنجاح ✅');
    goTo('orders');
  }catch(e){toast('خطأ: '+e.message)}
}

/* ============ Orders ============ */
function renderOrders(){
  return `<div class="page">
    <div class="header-bar">
      <button class="back-btn" onclick="goTo('shop')">→</button>
      <span style="font-weight:800">طلباتي</span>
      <div style="width:42px"></div>
    </div>
    <h2>طلباتي</h2>
    <div id="ordersList"><div class="loading">جاري التحميل...</div></div>
  </div>`;
}

let ordersListenerRef = null;

function loadMyOrders(){
  const el=document.getElementById('ordersList');
  if(!el) return;

  if (ordersListenerRef) {
    ordersListenerRef.off();
    ordersListenerRef = null;
  }

  ordersListenerRef = db.ref('orders').orderByChild('userUid').equalTo(S.user.uid);
  ordersListenerRef.on('value', s => {
    const data = s.val() || {};
    const arr = Object.values(data).sort((a,b)=>b.createdAt-a.createdAt);
    const el2 = document.getElementById('ordersList');
    if (!el2) return;
    if(!arr.length){
      el2.innerHTML='<div class="empty"><div class="empty-icon">📋</div><p>لا توجد طلبات بعد</p></div>';
      return;
    }
    el2.innerHTML=arr.map(o=>{
      const st=o.status||'new';
      const badge={new:'جديد',preparing:'قيد التجهيز',delivering:'قيد التوصيل',completed:'مكتمل',cancelled:'ملغي'}[st]||st;
      return `<div class="cart-item" style="flex-direction:column;align-items:stretch">
        <div class="row">
          <b>${esc(o.areaName||'—')}</b>
          <span class="badge badge-${st}">${badge}</span>
        </div>
        <div style="color:var(--muted);font-size:.85rem">${new Date(o.createdAt).toLocaleString('ar-LY')}</div>
        <div style="margin-top:8px">${(o.items||[]).map(i=>`<div>• ${esc(i.name)} × ${i.qty} = ${money(i.subtotal)}</div>`).join('')}</div>
        <div class="total-bar" style="margin-top:8px;margin-bottom:0"><span>الإجمالي</span><span>${money(o.total)}</span></div>
      </div>`;
    }).join('');
  });
}

/* ============ Account ============ */
function renderAccount(){
  return `<div class="page">
    <div class="header-bar">
      <button class="back-btn" onclick="goTo('shop')">→</button>
      <span style="font-weight:800">حسابي</span>
      <div style="width:42px"></div>
    </div>
    <h2>حسابي</h2>
    <div class="cart-item" style="flex-direction:column;align-items:stretch;gap:6px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
        ${S.user.photo?`<img src="${esc(S.user.photo)}" style="width:52px;height:52px;border-radius:50%;border:2px solid var(--purple)">`:''}
        <div>
          <div style="font-weight:800;font-size:1.2rem">${esc(S.user.name||'—')}</div>
          <div style="color:var(--muted);font-size:.85rem">${esc(S.user.email||'')}</div>
        </div>
      </div>
      <div style="color:var(--text);font-weight:700">📱 الهاتف: <span dir="ltr">${esc(S.user.phone)}</span></div>
      <div style="color:var(--text);font-weight:700">📍 المنطقة: ${esc(S.user.areaName||'—')}</div>
    </div>
    <button class="btn btn-outline" style="margin-top:16px" onclick="goTo('orders')">📋 طلباتي</button>
    <button class="btn" style="margin-top:12px;background:var(--danger)" onclick="logout()">تسجيل الخروج</button>
  </div>`;
}

function logout(){
  auth.signOut().catch(()=>{});
  clearSession();
  S.user=null;S.cart={};S.tempGoogleUser=null;S.currentProduct=null;
  try{sessionStorage.removeItem('bizo_current_product')}catch(e){}
  if (ordersListenerRef) { ordersListenerRef.off(); ordersListenerRef = null; }
  goTo('splash');
}

/* ============ Router ============ */
function render(){
  if(!S.user && !['splash','completeProfile'].includes(S.page)){
    S.page = 'splash';
  }
  const routes={
    splash:renderSplash,
    completeProfile:renderCompleteProfile,
    shop:renderShop,
    product:renderProduct,
    cart:renderCart,
    checkout:renderCheckout,
    orders:renderOrders,
    account:renderAccount
  };
  try {
    app.innerHTML=(routes[S.page]||renderSplash)();
  } catch(e) {
    console.error('Render error:', e);
    app.innerHTML = `<div class="page" style="justify-content:center;text-align:center">
      <div style="font-size:3rem;margin-bottom:16px">⚠️</div>
      <h2 style="color:var(--text)">حدث خطأ</h2>
      <p style="color:var(--muted);margin-bottom:20px">${esc(e.message)}</p>
      <button class="btn" onclick="location.reload()">إعادة التحميل</button>
    </div>`;
  }
  bindEvents();
}

function bindEvents(){
  if(S.page==='orders')loadMyOrders();
}

/* ============ تشغيل التطبيق ============ */
init();
</script>
</body>
</html>
